<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WF Market Tracker</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* dark theme (default) */
    :root {
      --bg: #1a1512; --bg2: #211c17; --border: #2e2820; --border2: #221e1a;
      --text: #e8e0d5; --text2: #f0e6d3; --muted: #7a6e63; --muted2: #9a8e83;
      --hover-bg: #1f1a15; --input-bg: #221e1a; --input-border: #3a3028;
      --btn-active-bg: #2e2820; --disclaimer: #5a4e43;
      --chart-bg: #1a1512; --chart-text: #9a8e83; --chart-grid: #2e2820;
    }
    :root.light {
      --bg: #f5f0eb; --bg2: #ede6dd; --border: #d4c8bc; --border2: #e0d8cf;
      --text: #2d2520; --text2: #1a1210; --muted: #7a6e63; --muted2: #5a4e43;
      --hover-bg: #ede6dd; --input-bg: #fff; --input-border: #c4b8ac;
      --btn-active-bg: #d4c8bc; --disclaimer: #9a8e83;
      --chart-bg: #f5f0eb; --chart-text: #5a4e43; --chart-grid: #d4c8bc;
    }

    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
    header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; background: var(--bg2); }
    header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text2); }
    header small { color: var(--muted); font-size: 0.75rem; }
    nav { display: flex; gap: 1rem; margin-left: auto; align-items: center; }
    nav a { color: var(--muted2); text-decoration: none; font-size: 0.9rem; }
    nav a.active, nav a:hover { color: var(--text2); }
    main { padding: 1.5rem 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 0.5rem 0.75rem; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border2); }
    tr:hover td { background: var(--hover-bg); }
    td a { color: var(--text); text-decoration: none; }
    td a:hover { color: var(--text2); }
    .up { color: #4caf7d; }
    .down { color: #e06c5a; }
    .search { padding: 0.5rem 0.75rem; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); border-radius: 4px; width: 220px; font-size: 0.875rem; }
    .search:focus { outline: none; border-color: var(--muted2); }
    #chart-view { display: none; }
    #chart-view.active { display: block; }
    #list-view.hidden { display: none; }
    #chart-container { height: 400px; margin-top: 1rem; }
    .range-bar { display: flex; gap: 0.25rem; margin-top: 1rem; }
    .range-btn { background: none; border: 1px solid var(--input-border); color: var(--muted); padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .range-btn:hover { color: var(--text2); border-color: var(--muted2); }
    .range-btn.active { color: var(--text2); border-color: var(--muted2); background: var(--btn-active-bg); }
    .back { background: none; border: 1px solid var(--input-border); color: var(--muted2); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
    .back:hover { color: var(--text2); border-color: var(--muted2); }
    .market-link { font-size: 0.85rem; color: var(--muted2); text-decoration: none; border: 1px solid var(--input-border); padding: 0.4rem 0.8rem; border-radius: 4px; }
    .market-link:hover { color: var(--text2); border-color: var(--muted2); }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text2); }
    .disclaimer { color: var(--disclaimer); font-size: 0.75rem; margin-top: 2rem; }
    .theme-btn { background: none; border: 1px solid var(--input-border); color: var(--muted2); padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .theme-btn:hover { color: var(--text2); border-color: var(--muted2); }
  </style>
</head>
<body>
  <header>
    <h1>WF Market Tracker</h1>
    <small>Indicative data — not affiliated with Digital Extremes or warframe.market</small>
    <nav>
      <a href="#" class="active" id="nav-list" onclick="showList()">All items</a>
      <a href="#" id="nav-movers" onclick="showMovers()">Top movers</a>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀ Light</button>
    </nav>
  </header>
  <main>
    <div id="list-view">
      <input class="search" type="text" id="search" placeholder="Search item…" oninput="filterTable()">
      <table id="items-table" style="margin-top:1rem">
        <thead>
          <tr>
            <th>Item</th>
            <th>Price (median)</th>
            <th>24h %</th>
            <th>7d %</th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>
    <div id="chart-view">
      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1rem">
        <button class="back" onclick="showList()">← Back</button>
        <a id="market-link" class="market-link" href="#" target="_blank" rel="noopener">Buy on market ↗</a>
      </div>
      <h2 id="chart-title"></h2>
      <div class="range-bar">
        <button class="range-btn active" onclick="setRange('1D', this)">1D</button>
        <button class="range-btn" onclick="setRange('5D', this)">5D</button>
        <button class="range-btn" onclick="setRange('1M', this)">1M</button>
        <button class="range-btn" onclick="setRange('6M', this)">6M</button>
        <button class="range-btn" onclick="setRange('ALL', this)">All</button>
      </div>
      <div id="chart-container"></div>
    </div>
    <p class="disclaimer">Data sourced from warframe.market · Refreshed every 45 min · Project not affiliated with Digital Extremes</p>
  </main>

  <script>
    let allItems = [];
    let currentSlug = null;
    let candleCache = {};
    let currentRange = '1D';
    let isDark = true;

    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.classList.toggle('light', !isDark);
      document.getElementById('theme-btn').textContent = isDark ? '☀ Light' : '☾ Dark';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (currentSlug) renderChart(currentSlug);
    }

    // restore saved theme
    if (localStorage.getItem('theme') === 'light') toggleTheme();

    async function loadItems() {
      const res = await fetch('/items');
      allItems = await res.json();
      renderTable(allItems);
    }

    async function loadMovers() {
      const res = await fetch('/movers');
      const movers = await res.json();
      renderTable(movers);
    }

    function renderTable(items) {
      const tbody = document.getElementById('items-body');
      tbody.innerHTML = (items || []).map(item => `
        <tr>
          <td><a href="#" onclick="showChart('${item.slug}', '${item.name}')">${item.name}</a></td>
          <td>${item.sell_median}pt</td>
          <td class="${pctClass(item.change_24h_pct)}">${fmtPct(item.change_24h_pct)}</td>
          <td class="${pctClass(item.change_7d_pct)}">${fmtPct(item.change_7d_pct)}</td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase();
      renderTable(allItems.filter(i => i.name.toLowerCase().includes(q)));
    }

    function pctClass(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
    function fmtPct(v) { if (v == null) return '—'; return (v > 0 ? '+' : '') + v.toFixed(1) + '%'; }

    const RANGES = {
      '1D':  { interval: '1h', points: 24 },
      '5D':  { interval: '1h', points: 120 },
      '1M':  { interval: '1h', points: 720 },
      '6M':  { interval: '1d', points: 180 },
      'ALL': { interval: '1d', points: Infinity },
    };

    async function fetchCandles(slug, interval) {
      if (!candleCache[slug]) candleCache[slug] = {};
      if (!candleCache[slug][interval]) {
        const res = await fetch(`/items/${slug}/candles?interval=${interval}`);
        const data = await res.json();
        candleCache[slug][interval] = (data || []).slice().reverse();
      }
      return candleCache[slug][interval];
    }

    async function showChart(slug, name) {
      currentSlug = slug;
      currentRange = '1D';
      document.querySelectorAll('.range-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
      document.getElementById('list-view').classList.add('hidden');
      document.getElementById('chart-view').classList.add('active');
      document.getElementById('chart-title').textContent = name;
      document.getElementById('market-link').href = `https://warframe.market/items/${slug}?type=sell`;
      await renderChart(slug);
    }

    async function renderChart(slug) {
      const { interval, points } = RANGES[currentRange];
      const all = await fetchCandles(slug, interval);
      const sorted = points === Infinity ? all : all.slice(-points);

      const container = document.getElementById('chart-container');
      container.innerHTML = '';

      const bg   = getComputedStyle(document.documentElement).getPropertyValue('--chart-bg').trim();
      const text = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim();
      const grid = getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim();

      const chart = LightweightCharts.createChart(container, {
        layout: { background: { color: bg }, textColor: text },
        grid: { vertLines: { color: grid }, horzLines: { color: grid } },
        width: container.clientWidth,
        height: 400,
      });

      const sellSeries = chart.addLineSeries({ color: '#26a69a', lineWidth: 2, title: 'Sell median' });
      const buySeries  = chart.addLineSeries({ color: '#5c6bc0', lineWidth: 2, title: 'Buy max' });
      const minSeries  = chart.addLineSeries({ color: '#ef5350', lineWidth: 1, title: 'Sell min' });

      const toTs = c => Math.floor(new Date(c.time).getTime() / 1000);
      sellSeries.setData(sorted.map(c => ({ time: toTs(c), value: c.sell_median })));
      buySeries.setData(sorted.map(c => ({ time: toTs(c), value: c.buy_max })));
      minSeries.setData(sorted.map(c => ({ time: toTs(c), value: c.sell_min })));

      chart.timeScale().fitContent();
    }

    async function setRange(range, btn) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (currentSlug) await renderChart(currentSlug);
    }

    function showList() {
      document.getElementById('list-view').classList.remove('hidden');
      document.getElementById('chart-view').classList.remove('active');
      document.getElementById('nav-list').classList.add('active');
      document.getElementById('nav-movers').classList.remove('active');
      renderTable(allItems);
    }

    function showMovers() {
      document.getElementById('nav-movers').classList.add('active');
      document.getElementById('nav-list').classList.remove('active');
      document.getElementById('chart-view').classList.remove('active');
      document.getElementById('list-view').classList.remove('hidden');
      loadMovers();
    }

    loadItems();
  </script>
</body>
</html>
