name: Deploy to NAS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v2
        with:
          hostname: github-actions
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy files to NAS
        run: |
          tar -czf - \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='./postgres' \
            . | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }} \
            "cd ${{ secrets.NAS_DEPLOY_PATH }} && tar -xzf -"

      - name: Build and redeploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }} \
            "cd ${{ secrets.NAS_DEPLOY_PATH }} && \
             COMPOSE=\$(docker compose version &>/dev/null && echo 'docker compose' || echo 'docker-compose') && \
             \$COMPOSE build && \
             \$COMPOSE up -d --remove-orphans"
